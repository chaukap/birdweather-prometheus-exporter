name: Scheduled vulnerability scan

on:
  schedule:
    # Every Monday at 06:00 UTC. New CVEs land constantly; this catches
    # vulnerabilities discovered in images that have already been released.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  scan-repo:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  scan-image:
    name: Trivy scan of latest published image
    runs-on: ubuntu-latest
    steps:
      - name: Check whether a published image exists yet
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image at $IMAGE yet; skipping scan."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy image scan
        if: steps.exists.outputs.found == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          exit-code: 0

      - name: Upload results to GitHub Security tab
        if: steps.exists.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
